name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Regression suite
        run: python tests/test_scanner.py

      - name: Scanner is deterministic on its own fixtures
        run: |
          python -m oca.cli scan tests/fixtures/numbered-md --json -o /tmp/a.json
          python -m oca.cli scan tests/fixtures/numbered-md --json -o /tmp/b.json
          diff /tmp/a.json /tmp/b.json && echo "deterministic: OK"

      - name: Scanner rejects a bad path with a non-zero exit
        run: |
          if python -m oca.cli scan /nonexistent/oca-path; then
            echo "::error::scanner accepted a nonexistent path"; exit 1
          else
            echo "bad path rejected: OK"
          fi

      - name: scan() never touches the network
        run: |
          # scan() must be offline by construction. If a future change makes
          # it fetch URLs, this proxy-less environment will hang or fail.
          python - <<'PYEOF'
          import json, subprocess, sys
          r = subprocess.run([sys.executable, "-m", "oca.cli", "scan",
                              "tests/fixtures/numbered-md", "--json"],
                             capture_output=True, text=True, timeout=120)
          assert r.returncode == 0, r.stderr
          links = json.loads(r.stdout)["links"]
          assert "by_status" not in links, "scan() judged links: it must not"
          assert "external_count" in links, "external links not collected"
          print("scan is offline and collects links: OK")
          PYEOF

      - name: linkcheck runs fully offline from cache
        run: |
          mkdir -p /tmp/lc-cache
          python -m oca.cli linkcheck tests/fixtures/numbered-md \
            --cache /tmp/lc-cache --offline --json -o /tmp/lc.json
          python - <<'PYEOF'
          import json
          rep = json.load(open("/tmp/lc.json"))
          assert rep["cache"]["offline"] is True
          print("offline linkcheck: OK", rep["by_status"])
          PYEOF

      - name: .oca.yml reaches the scanner
        run: |
          # The configuration file is only useful if it changes the result.
          # Regression guard for the bug where load_config() was imported by
          # the tests alone and scan() hardcoded its weights.
          cat > /tmp/oca-custom.yml <<'YAMLEOF'
          weights:
            structure: 0.30
            content: 0.20
            practice: 0.20
            reproducibility: 0.15
            licensing: 0.10
            agent_readiness: 0.05
          YAMLEOF
          python -m oca.cli scan tests/fixtures/numbered-md --json -o /tmp/base.json
          python -m oca.cli scan tests/fixtures/numbered-md --json \
            --config /tmp/oca-custom.yml -o /tmp/custom.json
          python - <<'PYEOF'
          import json
          base = json.load(open("/tmp/base.json"))["scores"]
          custom = json.load(open("/tmp/custom.json"))["scores"]
          assert base["weights"]["structure"] == 0.25, base["weights"]
          assert custom["weights"]["structure"] == 0.30, custom["weights"]
          assert base["overall"] != custom["overall"], "config had no effect"
          print("config reaches scanner: OK",
                base["overall"], "->", custom["overall"])
          PYEOF

      - name: CLI smoke test
        run: |
          python -m oca.cli --version
          python -m oca.cli templates | head
          python -m oca.cli report tests/fixtures/numbered-md -o /tmp/report.md
          test -s /tmp/report.md && echo "report generated: OK"
          # Every path the shipped skills point at must exist. Branch names
          # (oca/improve-<date>) are skipped: they are not filesystem paths.
          python - <<'PYEOF'
          import re, pathlib
          missing = []
          for skill in pathlib.Path("skills").glob("*/SKILL.md"):
              text = skill.read_text(encoding="utf-8")
              for ref in re.findall(r"`((?:oca|docs|scripts|assets)/[^`]+)`", text):
                  if "<" in ref:          # placeholder, e.g. oca/improve-<date>
                      continue
                  target = ref.rstrip("/")
                  if not pathlib.Path(target).exists():
                      missing.append(f"{skill}: {ref}")
          assert not missing, "skills point at missing paths:\n" + "\n".join(missing)
          print("skill references resolve: OK")
          PYEOF
